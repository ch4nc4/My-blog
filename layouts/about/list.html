{{ define "main" }}
<article class="about-page">
  <section class="about-hero">
    <div class="container">
      <div class="about-hero-inner">
        <div class="about-hero-avatar">
          {{ with .Site.Params.authorAvatar }}
          <img src="{{ . | relURL }}" alt="{{ $.Site.Params.author }}">
          {{ else }}
          <span class="about-avatar-fallback" aria-hidden="true">{{ substr (.Site.Params.author | default "A") 0 1
            }}</span>
          {{ end }}
        </div>
        <div class="about-hero-text">
          <p class="page-eyebrow">{{ .Title }}</p>
          <h1 class="about-title">{{ .Site.Params.author }}</h1>
          <p class="about-subtitle">{{ .Site.Params.authorBio | markdownify }}</p>
        </div>
      </div>
    </div>
  </section>
  <section class="about-content">{{ .Content }}</section>
</article>
{{ end }}
